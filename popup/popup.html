<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiftStream AutoFarm</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">◆</span>
      <div class="brand-text">
        <b>RIFTSTREAM</b>
        <small>AUTOFARM</small>
      </div>
    </div>
    <span id="statusPill" class="pill off">parado</span>
  </header>

  <main>
    <div id="errorBox" class="alert hidden"></div>

    <button id="toggleBtn" class="bigbtn">INICIAR AUTOFARM</button>

    <section class="card">
      <div class="card-head">
        <h2>Personagem</h2>
        <button id="openSite" class="link" type="button">abrir site</button>
      </div>
      <div id="charInfo" class="char">
        <span class="muted">Carregando...</span>
      </div>
      <div class="row">
        <button id="openLive" class="btn ghost" type="button">Abrir live</button>
        <button id="maintenanceBtn" class="btn ghost" type="button">Manutenção</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Melhor live</h2>
        <button id="refreshBtn" class="link" type="button">atualizar</button>
      </div>
      <label class="field">
        <span>Estratégia</span>
        <select id="strategy">
          <option value="zone">Maior zona</option>
          <option value="players">Mais jogadores</option>
          <option value="balanced">Equilibrado</option>
        </select>
      </label>
      <div id="candidates" class="candidates">
        <span class="muted small">Clique em atualizar para buscar as lives.</span>
      </div>
    </section>

    <details class="card" id="settingsCard">
      <summary>Configurações</summary>

      <div class="grid2">
        <label class="field">
          <span>Heartbeat (min)</span>
          <input id="heartbeatMin" type="number" min="5" max="25" step="1" />
        </label>
        <label class="field">
          <span>Manutenção (min)</span>
          <input id="maintenanceMin" type="number" min="2" max="60" step="1" />
        </label>
        <label class="field">
          <span>Mín. jogadores</span>
          <input id="minPlayers" type="number" min="1" max="500" step="1" />
        </label>
        <label class="field">
          <span>Ouro reservado</span>
          <input id="goldReserve" type="number" min="0" step="1000" />
        </label>
        <label class="field">
          <span>Classe inicial</span>
          <select id="fallbackClass">
            <option value="archer">Arqueiro</option>
            <option value="warrior">Guerreiro</option>
            <option value="cleric">Clérigo</option>
          </select>
        </label>
        <label class="field">
          <span>Trocar se zona +</span>
          <input id="switchHysteresis" type="number" min="1" max="10" step="1" />
        </label>
      </div>

      <div class="toggles">
        <label class="toggle"><input id="autoEquip" type="checkbox" /><span>Equipar os melhores itens</span></label>
        <label class="toggle"><input id="autoGems" type="checkbox" /><span>Subir gemas automaticamente</span></label>
        <label class="toggle"><input id="autoForge" type="checkbox" /><span>Forjar itens (VIP)</span></label>
        <label class="toggle"><input id="autoSocket" type="checkbox" /><span>Engastar gemas nos equipados</span></label>
        <label class="toggle"><input id="autoOrganize" type="checkbox" /><span>Organizar baús</span></label>
        <label class="toggle"><input id="autoSell" type="checkbox" /><span>Venda automática (VIP)</span></label>
        <label class="toggle"><input id="autoSwitch" type="checkbox" /><span>Trocar de live automaticamente</span></label>
        <label class="toggle"><input id="chatOnly" type="checkbox" /><span>Modo econômico (só chat)</span></label>
        <label class="toggle"><input id="muteTab" type="checkbox" /><span>Silenciar aba da live</span></label>
      </div>

      <div class="grid2 sellcfg">
        <label class="field">
          <span>Vender até raridade</span>
          <select id="sellRarity">
            <option value="-1">Desligado</option>
            <option value="0">Comum</option>
            <option value="1">Incomum</option>
            <option value="2">Raro</option>
            <option value="3">Épico</option>
          </select>
        </label>
        <label class="field">
          <span>Nível do item até</span>
          <input id="sellLevel" type="number" min="0" max="9999" step="5" />
        </label>
      </div>

      <div class="row">
        <button id="testChatBtn" class="btn ghost" type="button">Testar chat</button>
        <span id="saveHint" class="muted small"></span>
      </div>
    </details>

    <section class="card">
      <div class="card-head">
        <h2>Log</h2>
        <button id="clearLog" class="link" type="button">limpar</button>
      </div>
      <div id="log" class="log"><span class="muted small">Sem eventos ainda.</span></div>
    </section>

    <p class="warn">
      Automação viola os Termos do RiftStream (seção 5) e pode violar os da Twitch.
      Sua conta pode ser banida. Use por sua conta e risco.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
