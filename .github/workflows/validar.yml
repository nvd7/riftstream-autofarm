name: validar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar extensão
        run: node tools/validate.mjs

      - name: Empacotar release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/riftstream-autofarm
          cp -r manifest.json background.js content popup icons \
            README.md LICENSE CHANGELOG.md PRIVACY.md \
            dist/riftstream-autofarm/
          cd dist
          zip -r "riftstream-autofarm-${GITHUB_REF_NAME}.zip" riftstream-autofarm
          unzip -l "riftstream-autofarm-${GITHUB_REF_NAME}.zip"

      - name: Publicar artefato
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: riftstream-autofarm-${{ github.ref_name }}
          path: dist/*.zip
          retention-days: 14
